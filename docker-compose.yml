version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: talentmatch_db
      POSTGRES_USER: talentmatch_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: django-insecure-lf#v_2$c286&6$y!n=mi&5+c2-y@+(elnm!pn%3q$(k(8sfhdg
      DEBUG: "True"
      POSTGRES_DB: talentmatch_db
      POSTGRES_USER: talentmatch_user
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    depends_on:
      - db
    volumes:
      - .:/app
      - media_files:/app/media

volumes:
  postgres_data:
  media_files: